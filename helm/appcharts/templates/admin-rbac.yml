{{- if .Values.clusterAdminEnabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: php-app-admin
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: php-app-admin-binding
subjects:
- kind: ServiceAccount
  name: php-app-admin
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }} 